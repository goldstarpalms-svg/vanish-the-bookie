services:
  - type: web
    name: vanish-the-bookie
    env: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_MODE
        value: demo
      - key: LIVE_SPORT_KEYS
        value: baseball_mlb,basketball_wnba,soccer_fa_cup,soccer_epl,basketball_nba,icehockey_liiga
      - key: ODDS_REGIONS
        value: us,uk
      - key: LIVE_REFRESH_MINUTES
        value: 60
